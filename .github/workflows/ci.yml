name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests (unit, integration, e2e) + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: cbt, POSTGRES_PASSWORD: cbt, POSTGRES_DB: cbt }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cbt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cbt:cbt@localhost:5432/cbt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run test:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            reports/tests.json
            reports/coverage/coverage-summary.json

  mutation:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run mutation
      - name: Mutation testing of the DI library
        run: npm run mutation:di
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            reports/mutation/mutation.json
            reports/mutation-di.json

  sql-mutation:
    name: SQL mutants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: cbt, POSTGRES_PASSWORD: cbt, POSTGRES_DB: cbt }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cbt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cbt:cbt@localhost:5432/cbt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run mutation:sql
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sql-mutation-results, path: reports/sql-mutation.json }

  compat:
    name: Zero-downtime migrations (old version on new schema)
    runs-on: ubuntu-latest
    # Попередня версія: база PR або попередній коміт main.
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: cbt, POSTGRES_PASSWORD: cbt, POSTGRES_DB: cbt_compat }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cbt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cbt:cbt@localhost:5432/cbt_compat
    steps:
      - uses: actions/checkout@v4
        with: { path: new }
      - uses: actions/checkout@v4
        with:
          path: old
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: |
            new/package-lock.json
            old/package-lock.json
      - run: npm ci && npm run build
        working-directory: old
      - run: npm ci && npm run build
        working-directory: new
      - run: new/scripts/compat-check.sh old new

  perf:
    name: Performance budget (p99)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: cbt, POSTGRES_PASSWORD: cbt, POSTGRES_DB: cbt_perf }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cbt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PERF_DATABASE_URL: postgres://cbt:cbt@localhost:5432/cbt_perf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci && npm run build
      # Одноразова база раннера: вимикаємо очікування fsync. Інакше p99 записів міряє
      # спільний диск раннера (стрибки до 135 мс при p50 5 мс), а не застосунок і запити.
      # Див. perf/README.md, «Контроль у CI».
      - name: Disable durability on the throwaway CI database
        run: |
          psql "$PERF_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
          psql "$PERF_DATABASE_URL" -tAc "SHOW synchronous_commit; SHOW fsync"
      - run: npm run perf:prepare
      # Бюджет — з spec (нефункціональні вимоги); див. perf/README.md.
      - run: npm run perf -- --duration 5 --repeat 3 --budget-p99 50
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: perf-results, path: reports/perf.json }

  report:
    name: Quality report
    runs-on: ubuntu-latest
    needs: [test, mutation, sql-mutation, perf]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Put results where the report expects them
        run: |
          mkdir -p reports/coverage reports/mutation
          cp artifacts/test-results/tests.json reports/ 2>/dev/null || true
          cp artifacts/test-results/coverage/coverage-summary.json reports/coverage/ 2>/dev/null || true
          cp artifacts/mutation-results/mutation/mutation.json reports/mutation/ 2>/dev/null || true
          cp artifacts/mutation-results/mutation-di.json reports/ 2>/dev/null || true
          cp artifacts/sql-mutation-results/sql-mutation.json reports/ 2>/dev/null || true
          cp artifacts/perf-results/perf.json reports/ 2>/dev/null || true
      - run: npm run report
      - uses: actions/upload-artifact@v4
        with: { name: quality-report, path: reports/index.html }
